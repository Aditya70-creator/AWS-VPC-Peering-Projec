<svg width="100%" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- True GitHub Dark Background (#0D1117 to #010409) -->
    <linearGradient id="canvasBg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#010409" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#010409" />
    </linearGradient>

    <!-- Subtle Dark Dot Matrix -->
    <pattern id="dotMatrix" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262D" fill-opacity="0.7" />
    </pattern>

    <!-- Subtle Neon Ambient Glows -->
    <radialGradient id="amberSpot" cx="0.75" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#FF9900" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FF9900" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanSpot" cx="0.18" cy="0.3" r="0.45">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Dark Card Fill -->
    <linearGradient id="darkCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#090C10" />
    </linearGradient>

    <!-- Outer Border -->
    <linearGradient id="outerStroke" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#21262D" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="80%" stop-color="#FF9900" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#21262D" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Pitch-Dark Frame -->
  <rect width="1200" height="340" rx="18" fill="url(#canvasBg)" />
  <rect width="1200" height="340" rx="18" fill="url(#dotMatrix)" />
  <rect width="1200" height="340" rx="18" fill="url(#amberSpot)" />
  <rect width="1200" height="340" rx="18" fill="url(#cyanSpot)" />
  <rect x="1" y="1" width="1198" height="338" rx="17" stroke="url(#outerStroke)" stroke-width="1.5" />

  <!-- Top Status Bar -->
  <g transform="translate(48, 34)">
    <circle cx="6" cy="6" r="5" fill="#F85149" fill-opacity="0.85" />
    <circle cx="24" cy="6" r="5" fill="#D29922" fill-opacity="0.85" />
    <circle cx="42" cy="6" r="5" fill="#3FB950" fill-opacity="0.85" />
    <text x="64" y="10" fill="#484F58" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">
      aws-cloud-labs // ap-south-1 (mumbai) // pcx-active
    </text>
  </g>

  <!-- LEFT SECTION -->
  <g transform="translate(48, 86)">
    <rect x="0" y="0" width="218" height="26" rx="6" fill="#FF9900" fill-opacity="0.1" stroke="#FF9900" stroke-opacity="0.4" />
    <text x="109" y="17" text-anchor="middle" fill="#FF9900" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" letter-spacing="1">AWS NETWORKING LAB</text>

    <text x="0" y="68" fill="#F0F6FC" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.8">
      Cross-VPC Connectivity
    </text>
    <text x="0" y="106" fill="#58A6FF" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="25" font-weight="700" letter-spacing="-0.3">
      VPC Peering + Bastion ProxyJump
    </text>

    <text x="0" y="142" fill="#8B949E" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14.5">
      Zero-trust private routing between isolated CIDR blocks with hardened
    </text>
    <text x="0" y="163" fill="#8B949E" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14.5">
      Security Groups and key-less Bastion SSH forwarding.
    </text>

    <g transform="translate(0, 188)">
      <rect x="0" y="0" width="118" height="28" rx="6" fill="#161B22" stroke="#30363D" />
      <text x="59" y="18" text-anchor="middle" fill="#C9D1D9" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">10.10.0.0/16</text>

      <rect x="128" y="0" width="118" height="28" rx="6" fill="#161B22" stroke="#30363D" />
      <text x="187" y="18" text-anchor="middle" fill="#C9D1D9" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">10.20.0.0/16</text>

      <rect x="256" y="0" width="136" height="28" rx="6" fill="#161B22" stroke="#30363D" />
      <text x="324" y="18" text-anchor="middle" fill="#3FB950" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">ICMP + SSH Only</text>
    </g>
  </g>

  <!-- RIGHT SECTION: Pitch-Black Architecture Schematic -->
  <g transform="translate(570, 36)">
    <rect x="0" y="0" width="582" height="268" rx="14" fill="#010409" stroke="#21262D" stroke-width="1.5" />

    <!-- VPC-A Boundary -->
    <rect x="18" y="18" width="236" height="232" rx="10" fill="url(#darkCard)" stroke="#58A6FF" stroke-width="1.3" stroke-dasharray="6 3" />
    <rect x="30" y="10" width="142" height="18" rx="4" fill="#010409" stroke="#58A6FF" stroke-width="1" />
    <text x="101" y="22" text-anchor="middle" fill="#58A6FF" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">VPC-A (10.10.0.0/16)</text>

    <!-- Public Subnet -->
    <rect x="32" y="42" width="208" height="84" rx="8" fill="#090C10" stroke="#3FB950" stroke-opacity="0.55" stroke-width="1.2" />
    <text x="44" y="60" fill="#3FB950" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PUBLIC SUBNET - 10.10.1.0/24</text>
    <rect x="44" y="70" width="184" height="44" rx="6" fill="#161B22" stroke="#3FB950" stroke-width="1.2" />
    <circle cx="60" cy="92" r="5" fill="#3FB950" filter="url(#neonGlow)" />
    <text x="74" y="89" fill="#F0F6FC" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">Bastion Host</text>
    <text x="74" y="104" fill="#8B949E" font-family="ui-monospace, monospace" font-size="10.5">10.10.1.10 [IGW Attached]</text>

    <!-- Private Subnet A -->
    <rect x="32" y="144" width="208" height="92" rx="8" fill="#090C10" stroke="#30363D" stroke-width="1.2" />
    <text x="44" y="162" fill="#8B949E" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PRIVATE SUBNET - 10.10.2.0/24</text>
    <rect x="44" y="172" width="184" height="50" rx="6" fill="#161B22" stroke="#58A6FF" stroke-width="1.2" />
    <circle cx="60" cy="197" r="5" fill="#58A6FF" />
    <text x="74" y="193" fill="#F0F6FC" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">App-A Instance</text>
    <text x="74" y="209" fill="#8B949E" font-family="ui-monospace, monospace" font-size="10.5">10.10.2.10 [No Public IP]</text>

    <line x1="136" y1="114" x2="136" y2="172" stroke="#3FB950" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- VPC-B Boundary -->
    <rect x="342" y="18" width="222" height="232" rx="10" fill="url(#darkCard)" stroke="#BC8CFF" stroke-width="1.3" stroke-dasharray="6 3" />
    <rect x="354" y="10" width="142" height="18" rx="4" fill="#010409" stroke="#BC8CFF" stroke-width="1" />
    <text x="425" y="22" text-anchor="middle" fill="#D2A8FF" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">VPC-B (10.20.0.0/16)</text>

    <!-- Isolated Tag -->
    <rect x="356" y="42" width="194" height="54" rx="8" fill="#090C10" stroke="#21262D" stroke-width="1" />
    <text x="453" y="65" text-anchor="middle" fill="#6E7681" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">ISOLATED NETWORK</text>
    <text x="453" y="82" text-anchor="middle" fill="#484F58" font-family="ui-monospace, monospace" font-size="10">No Internet Gateway (IGW)</text>

    <!-- Private Subnet B -->
    <rect x="356" y="114" width="194" height="122" rx="8" fill="#090C10" stroke="#BC8CFF" stroke-opacity="0.55" stroke-width="1.2" />
    <text x="368" y="134" fill="#D2A8FF" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PRIVATE - 10.20.1.0/24</text>
    <rect x="368" y="148" width="170" height="72" rx="6" fill="#161B22" stroke="#BC8CFF" stroke-width="1.2" />
    <circle cx="384" cy="184" r="5" fill="#BC8CFF" />
    <text x="398" y="179" fill="#F0F6FC" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">App-B Instance</text>
    <text x="398" y="196" fill="#8B949E" font-family="ui-monospace, monospace" font-size="10.5">10.20.1.10</text>
    <text x="398" y="211" fill="#6E7681" font-family="ui-monospace, monospace" font-size="9.5">[Private Only]</text>

    <!-- Peering Tunnel -->
    <path d="M 228 197 L 368 197" stroke="#FF9900" stroke-width="2.5" />
    <circle r="4.5" fill="#FF9900" filter="url(#neonGlow)">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M 228 197 L 368 197" />
    </circle>
    <circle r="4" fill="#58A6FF" filter="url(#neonGlow)">
      <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M 368 197 L 228 197" />
    </circle>

    <!-- Peering Hub Badge -->
    <rect x="266" y="146" width="64" height="36" rx="8" fill="#010409" stroke="#FF9900" stroke-width="1.6" />
    <text x="298" y="162" text-anchor="middle" fill="#FF9900" font-family="ui-monospace, monospace" font-size="10" font-weight="800">VPC</text>
    <text x="298" y="174" text-anchor="middle" fill="#F0F6FC" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">PEERING</text>

    <!-- ProxyJump Line -->
    <path d="M 228 92 C 298 92, 298 130, 368 164" fill="none" stroke="#3FB950" stroke-width="1.5" stroke-dasharray="4 3" />
    <circle r="3.5" fill="#3FB950" filter="url(#neonGlow)">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M 228 92 C 298 92, 298 130, 368 164" />
    </circle>
  </g>
</svg>